<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Web Sitem</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            text-align: center;
        }

        header {
            background: #111827;
            color: white;
            padding: 60px 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .kartlar {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .kart {
            background: white;
            width: 250px;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .kart h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <header>
        <h1>Benim Dijital Atölyem</h1>
        <p>Yapay zekâ, eğitim uygulamaları ve dijital projeler</p>
    </header>

    <div class="container">

        <h2>Projelerim</h2>

        <div class="kartlar">

            <div class="kart">
                <h2>📱 Uygulamalar</h2>
                <p>Hazırladığım eğitim ve yapay zekâ uygulamaları.</p>
            </div>

            <div class="kart">
                <h2>🎬 Videolar</h2>
                <p>Hazırladığım videolar ve animasyonlar.</p>
            </div>

            <div class="kart">
                <h2>🖼️ Galeri</h2>
                <p>Hazırladığım görseller ve tasarımlar.</p>
            </div>

        </div>

    </div>

</body>
</html>
